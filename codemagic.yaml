workflows:
  nexus-build:
    name: NEXUS Overlay
    max_build_duration: 60
    instance_type: linux
    environment:
      flutter: stable
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Build APK
        script: |
          flutter build apk --release \
            --target-platform android-arm64
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      
