workflows:
  nexus-build:
    name: NEXUS Overlay
    max_build_duration: 60
    instance_type: linux
    environment:
      flutter: stable
      java: 17
      vars:
        GEMINI_API_KEY: "${GEMINI_API_KEY}"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Build APK
        script: |
          flutter build apk --release \
            --dart-define=GEMINI_API_KEY=${GEMINI_API_KEY} \
            --target-platform android-arm64
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
    publishing:
      github_releases:
        enabled: false
