workflows:
  nexus-build:
    name: NEXUS Overlay
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      java: 17
      vars:
        GEMINI_API_KEY: ""  # Set this in Codemagic UI > Environment variables
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Build APK
        script: |
          #!/usr/bin/env bash
          set -e
          flutter clean
          flutter pub get
          
          # Try generating launcher icons, but continue if it fails
          echo "Generating launcher icons..."
          dart run flutter_launcher_icons || echo "Warning: Icon generation skipped"
          
          echo "Building release APK..."
          flutter build apk --release \
            --target-platform android-arm64 \
            --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY" \
            --android-skip-build-dependency-validation 2>&1
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
