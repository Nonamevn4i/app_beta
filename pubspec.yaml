name: performance_monitor
description: "NEXUS Overlay - Real-time performance monitoring HUD"
publish_to: 'none'
version: 4.2.0+1

environment:
  sdk: ^3.2.0

dependencies:
  flutter:
    sdk: flutter
  flutter_overlay_window: ^0.4.3
  fl_chart: ^0.69.2
  permission_handler: ^11.2.0
  http: ^1.2.0
  google_generative_ai: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
dev_dependencies:
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  
