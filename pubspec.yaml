name: performance_monitor
description: "NEXUS Overlay - Real-time performance monitoring HUD"
publish_to: 'none'
version: 4.2.0+1

environment:
  sdk: '^3.2.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_overlay_window: ^0.4.3
  fl_chart: ^0.69.2
  permission_handler: ^11.2.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
